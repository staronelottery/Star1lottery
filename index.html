

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E1A19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STARONE">
<meta name="application-name" content="STARONE">

<title>STARONE LOTTERY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --nav:#1E1A19;
  --hero:#065143;
  --bg:#FFEECF;
  --cta:#417D96;
  --active:#065143;
  --text:#1E1A19;
  --mute:#5F7367;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Montserrat,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  height:68px;
  background:var(--nav);
  color:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
}

.logo{
  text-align:center;
  line-height:1.15;
}

.logo b{
  display:block;
  font-size:21px;
  letter-spacing:2px;
}

.logo span{
  font-size:9px;
  letter-spacing:5px;
}

main{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:24px 20px 30px;
  text-align:center;
}

.hero{
  width:100%;
  border-radius:18px;
  overflow:hidden;
  background:var(--hero);
}

.hero svg{
  display:block;
  width:100%;
  height:auto;
}

.heading{
  font-size:25px;
  line-height:1.45;
  font-weight:800;
  margin-top:27px;
}

.badge{
  display:inline-block;
  background:var(--nav);
  color:var(--bg);
  padding:12px 30px;
  border-radius:10px;
  margin-top:18px;
}

.badge b{
  display:block;
  font-size:22px;
  letter-spacing:3px;
}

.badge span{
  font-size:10px;
  letter-spacing:6px;
}

.description{
  font-size:13px;
  color:var(--mute);
  line-height:1.8;
  margin:22px 5px;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:25px;
}

.btn{
  min-height:55px;
  border-radius:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
  transition:.15s;
}

.download{
  background:var(--cta);
  color:white;
  border:1px solid var(--cta);
}

.contact{
  background:transparent;
  color:var(--text);
  border:1px solid var(--text);
}

.btn:active{
  transform:scale(.98);
  opacity:.85;
}

.footer{
  background:var(--nav);
  color:var(--bg);
  text-align:center;
  padding:17px 12px;
  font-size:10px;
  line-height:1.8;
}

.footer span{
  color:#A9B9AC;
}

@media(min-width:600px){
  main{
    padding-top:35px;
    padding-bottom:40px;
  }

  .heading{
    font-size:29px;
  }
}
</style>
</head>

<body>

<div class="page">

<header class="header">
  <div class="logo">
    <b>STARONE</b>
    <span>LOTTERY</span>
  </div>
</header>

<main>

  <div class="hero">
    <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
      <rect width="360" height="220" fill="#065143"/>

      <circle cx="290" cy="55" r="65" fill="#417D96"/>

      <g fill="#FFEECF">
        <path d="M55 35l5 12 13 2-10 8 3 13-11-7-11 7 3-13-10-8 13-2z"/>
        <circle cx="305" cy="175" r="4"/>
        <circle cx="65" cy="180" r="3"/>
        <circle cx="145" cy="30" r="3"/>
        <circle cx="235" cy="190" r="3"/>
      </g>

      <g transform="rotate(-5 180 110)">
        <rect x="75" y="67" width="210" height="90" rx="12" fill="#FFEECF"/>
        <circle cx="75" cy="112" r="10" fill="#065143"/>
        <circle cx="285" cy="112" r="10" fill="#065143"/>

        <text x="180" y="108"
          text-anchor="middle"
          font-family="Montserrat"
          font-size="23"
          font-weight="800"
          fill="#1E1A19">STARONE</text>

        <text x="180" y="130"
          text-anchor="middle"
          font-family="Montserrat"
          font-size="11"
          letter-spacing="5"
          fill="#1E1A19">LOTTERY</text>
      </g>
    </svg>
  </div>

  <h1 class="heading">
    BHARAT KA PEHLA<br>
    LIVE LOTTERY APP
  </h1>

  <div class="badge">
    <b>STARONE</b>
    <span>LOTTERY</span>
  </div>

  <p class="description">
    Download the official STARONE application
    and access the app directly from your device.
  </p>

  <div class="buttons">

    <a class="btn download"
       href="./STARONE.apk"
       download="STARONE.apk">
       DOWNLOAD STARONE APK
    </a>

    <a class="btn contact"
       href="https://wa.me/919351883616"
       target="_blank"
       rel="noopener">
       CONTACT ON WHATSAPP
    </a>

  </div>

</main>

<footer class="footer">
  <b>STARONE LOTTERY</b><br>
  <span>Official Application Download Website</span>
</footer>

</div>

</body>
</html>
