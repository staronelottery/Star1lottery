
<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app-config.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#065143">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STARONE">
<meta name="application-name" content="STARONE">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<title>STARONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--nav:#1E1A19;
--hero:#065143;
--bg:#FFEECF;
--card:#FFEECF;
--cta:#417D96;
--active:#065143;
--footer:#1E1A19;
--text:#1E1A19;
--border:#5F7367;
--mute:#5F7367
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:Montserrat,system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}
.hd{background:var(--nav);color:var(--bg);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;flex:none}
.ib{width:44px;height:44px;background:none;border:0;color:var(--bg);display:grid;place-items:center;position:relative}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib svg,.nav svg,.mi svg{width:24px;height:24px}
.badge{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--cta)}
.lg{text-align:center;line-height:1.1}
.lg b{display:block;font-size:18px;font-weight:700;letter-spacing:1px}
.lg span{font-size:9px;font-weight:600;letter-spacing:4px}
.body{flex:1;overflow:auto;padding:16px}
.cen{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.h1{font-size:25px;font-weight:700;text-align:center}
.h2{font-size:20px;font-weight:600}
.sub{font-size:13px;font-weight:500;color:var(--mute);text-align:center;margin-top:6px}
.in{width:100%;height:54px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);font:500 14px Montserrat;color:var(--text);margin-top:12px;outline:0}
.in:focus{border-color:var(--active);box-shadow:0 0 0 1px var(--active)}
.in::placeholder{color:var(--mute)}
.btn{width:100%;min-height:52px;border-radius:26px;border:1px solid var(--cta);background:var(--cta);color:#fff;font:600 15px Montserrat;margin-top:14px;display:flex;gap:8px;align-items:center;justify-content:center}
.btn svg{width:20px;height:20px}
.btn:active{background:var(--active);border-color:var(--active)}
.btn.o{background:var(--card);color:var(--text);border-color:var(--text);font-weight:500}
.btn.o:active{background:var(--border);color:var(--bg)}
.btn:disabled{opacity:.4}
.lnk{background:none;border:0;font:600 13px Montserrat;color:var(--cta);min-height:44px}
.hero{border-radius:20px;overflow:hidden;background:var(--hero)}
.hero svg{display:block;width:100%;stroke:none}
.badgeL{background:var(--nav);color:#fff;text-align:center;border-radius:10px;padding:10px 26px;margin:18px auto 0;width:max-content;line-height:1.1}
.badgeL b{display:block;font-size:20px;letter-spacing:2px}
.badgeL span{font-size:10px;letter-spacing:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.cd{padding:14px}
.pill{background:var(--nav);color:var(--bg);font-weight:700;padding:5px 14px;border-radius:14px;font-size:14px}
.pill.c{background:var(--cta);color:#fff}
.pill.g{background:var(--active);font-size:11px;font-weight:600;padding:4px 10px}
small,.sm{font-size:11px;color:var(--mute);font-weight:500}
.bar{height:6px;background:rgba(95,115,103,.25);border-radius:3px;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--active);border-radius:3px}
.ft{background:var(--hero);color:var(--bg);display:flex;justify-content:space-between;padding:9px 14px;font-size:12px;font-weight:600}
.stat{background:rgba(95,115,103,.16);border-radius:8px;padding:10px 12px;font-size:11px;font-weight:600;display:flex;justify-content:space-between;margin:12px 0}
.tabs,.grid{display:grid;gap:6px}
.tabs{grid-template-columns:repeat(4,1fr);margin:12px 0}
.grid{grid-template-columns:repeat(5,1fr)}
.tabs button{height:44px;border:1px solid var(--border);border-radius:8px;background:var(--card);font:600 9px Montserrat;color:var(--text)}
.tabs .a{background:var(--active);border-color:var(--active);color:#fff}
.grid button{height:44px;border:1px solid var(--text);border-radius:8px;background:var(--card);font:600 10px Montserrat;color:var(--text)}
.grid .s{background:var(--active);border-color:var(--active);color:#fff}
.grid .x{background:rgba(95,115,103,.15);border-color:rgba(95,115,103,.3);color:var(--mute)}
.tray{flex:none;border-top:1px solid var(--border);padding:10px 16px 12px;background:var(--card)}
.tray b{font-size:14px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips span{background:var(--nav);color:var(--bg);font-size:10px;font-weight:600;padding:7px 9px;border-radius:6px}
.tm{text-align:center;font-size:30px;font-weight:700;margin:18px 0}
.pay h2{font-size:26px;font-weight:700;color:var(--active)}
.er{color:var(--nav);font-size:12px;font-weight:600;margin-top:8px;min-height:16px}
.ok{color:var(--active)}
.sec{display:flex;gap:6px;justify-content:center;align-items:center;font-size:12px;color:var(--mute);margin-top:12px}
.sec svg{width:14px;height:14px}
.nav{display:flex;background:var(--footer);flex:none;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;padding:7px 0;font-size:10.5px;font-weight:500;color:rgba(255,238,207,.6);border-radius:12px}
.nav svg{display:block;margin:0 auto 2px}
.nav .a{background:var(--active);color:var(--bg);font-weight:600}
.dim{position:fixed;inset:0;background:rgba(30,26,25,.6);opacity:0;pointer-events:none;transition:.25s;z-index:9}
.dim.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;left:0;width:78%;background:var(--bg);transform:translateX(-100%);transition:.25s;z-index:10;padding:28px 20px;overflow:auto}
.dr.on{transform:none}
.mi{display:flex;gap:14px;align-items:center;min-height:50px;font-weight:500;font-size:15px;border-bottom:1px solid rgba(95,115,103,.3);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--text);text-align:left;font-family:Montserrat}
.mi:active{background:rgba(95,115,103,.2)}
.av{display:grid;place-items:center;border-radius:50%;background:var(--cta);color:#fff;font-weight:700;flex:none}
.toast{position:fixed;left:16px;right:16px;bottom:90px;background:var(--nav);color:var(--bg);padding:12px;border-radius:12px;text-align:center;font-weight:600;font-size:13px;z-index:20}
</style>
</head>

<body>
<div id="app"></div>
<div class="dim" id="dim" onclick="dr(0)"></div>
<div class="dr" id="dr"></div>

<script>
/* STARONE — Supabase connected app */
const SB_URL = window.STARONE_SUPABASE_URL;
const SB_KEY = window.STARONE_SUPABASE_PUBLISHABLE_KEY;

if (!SB_URL || !SB_KEY || SB_KEY === 'YAHAN_APNI_PUBLISHABLE_KEY_PASTE_KARO') {
 console.error('STARONE Supabase configuration is missing.');
}

const db = window.supabase.createClient(SB_URL, SB_KEY);

var $=function(i){return document.getElementById(i)},app=$('app'),
cur='intro',st=[],U={n:'',e:'',m:''},sel=[],li=0,ser='A',T=299,tid=null,
PS={},M={t:'',x:''},L=[],W=[],mine=[],TABS=['home','tix','win','prof'],
session=null,authBusy=false,pend='';

var I={
menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
ticket:'<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/>',
trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 20h8"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
login:'<path d="M14 8l4 4-4 4M18 12H4M14 4v4M14 16v4"/>',
back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
check:'<path d="M5 12l4 4L19 6"/>',
help:'<circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.7 1.8c-.9.7-1.5 1.1-1.5 2.4M12 17h.01"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/>',
doc:'<path d="M7 3h7l3 3v15H7zM14 3v4h4"/>',
lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.2-2-3.4-2.1 1.1A7 7 0 0 0 15 6l-.3-2.3h-4L10.4 6a7 7 0 0 0-1.8 1.3L6.5 6.2l-2 3.4 2 1.2A7 7 0 0 0 6.4 12c0 .4 0 .8.1 1.2l-2 1.2 2 3.4 2.1-1.1A7 7 0 0 0 10 18l.3 2.3h4L14.6 18a7 7 0 0 0 1.8-1.3l2.2 1.1 2-3.4-2-1.2c.3-.4.4-.8.4-1.2z"/>'
};

function ic(n){return '<svg viewBox="0 0 24 24">'+(I[n]||'')+'</svg>'}

function hero(h){
 return '<div class="hero"><svg viewBox="0 0 320 '+h+'"><rect width="320" height="'+h+'" fill="#065143"/><circle cx="262" cy="'+h*.28+'" r="'+h*.2+'" fill="#417D96"/><g fill="#FFEECF"><path d="M36 24l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z"/><circle cx="286" cy="'+(h-30)+'" r="4"/><circle cx="56" cy="'+(h-26)+'" r="3"/><circle cx="120" cy="16" r="3"/></g><g transform="rotate(-7 160 '+h/2+')"><rect x="76" y="'+(h/2-42)+'" width="168" height="84" rx="10" fill="#FFEECF"/><circle cx="76" cy="'+h/2+'" r="8" fill="#065143"/><circle cx="244" cy="'+h/2+'" r="8" fill="#065143"/><text x="160" y="'+(h/2-5)+'" text-anchor="middle" fill="#1E1A19" font-family="Montserrat" font-size="16" font-weight="700">STARONE</text><text x="160" y="'+(h/2+16)+'" text-anchor="middle" fill="#1E1A19" font-family="Montserrat" font-size="10" letter-spacing="3">LOTTERY</text></g></svg></div>'
}

function av(s){
 return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 64 64" style="stroke:none;flex:none"><circle cx="32" cy="32" r="32" fill="#417D96"/><circle cx="32" cy="25" r="11" fill="#FFEECF"/><path d="M10 58c2-13 12-19 22-19s20 6 22 19a32 32 0 0 1-44 0z" fill="#FFEECF"/></svg>'
}

function hdr(t){
 return '<div class="hd"><button class="ib" aria-label="'+(t=='menu'?'Menu':'Back')+'" onclick="'+(t=='menu'?'dr(1)':'goBack()')+'">'+ic(t=='menu'?'menu':'back')+'</button><div class="lg"><b>STARONE</b><span>LOTTERY</span></div><button class="ib" aria-label="Notifications">'+ic('bell')+'<i class="badge"></i></button></div>'
}

function nav(a){
 var N=['Home','My Tickets','Winners','Profile'],C=['home','ticket','trophy','user'];
 return '<div class="nav">'+N.map(function(x,i){return '<a role="button" class="'+(i==a?'a':'')+'" onclick="tab(\''+TABS[i]+'\')">'+ic(C[i])+x+'</a>'}).join('')+'</div>'
}

function chips(){return sel.map(function(n){return '<span>'+escapeHtml(n)+'</span>'}).join('')}

function escapeHtml(v){
 return String(v==null?'':v).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
 })
}

function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}

function formatDate(v){
 if(!v)return '';
 try{return new Date(v).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
 catch(e){return ''}
}

function lcard(i){
 var l=L[i],total=Number(l.total||0),avail=Number(l.avail||0);
 return '<div class="card" onclick="openL('+i+')"><div class="cd"><h3 class="h2" style="font-size:18px">'+escapeHtml(l.name)+'</h3><div class="row" style="margin-top:10px"><div><small>Prize Pool</small><div class="h2" style="font-weight:700">'+escapeHtml(l.pool||money(l.prize_pool))+'</div></div><div style="text-align:right"><small>Entry</small><br><span class="pill">'+money(l.price)+'</span></div></div><div class="bar"><i style="width:'+Math.min(100,total?Math.round((total-avail)/total*100):0)+'%"></i></div><div class="row"><small>Total '+total+'</small><small>Available '+avail+'</small></div></div></div>'
}

function tcard(t){
 return '<div class="card cd"><div class="row"><b>'+escapeHtml(t.lottery_name||t.l)+'</b><span class="pill g">'+escapeHtml(t.s||t.status||'Active')+'</span></div><div class="h2" style="margin:6px 0;font-weight:700">'+escapeHtml(t.ticket_number||t.t)+'</div><div class="row"><small>Entry '+money(t.price||t.p)+'</small><small>'+formatDate(t.purchased_at||t.d)+'</small></div></div>'
}

function row(t){
 return '<div class="row card cd"><span style="font-weight:600">'+escapeHtml(t)+'</span><span class="ok">'+ic('check')+'</span></div>'
}

function mrow(i,t,f){return '<button class="mi" onclick="'+f+'">'+ic(i)+escapeHtml(t)+'</button>'}

var SC={

intro:function(){
 return{b:'<div class="cen">'+hero(250)+'<h1 class="h1" style="margin-top:26px;line-height:1.35">BHARAT KA PEHLA<br>LIVE LOTTERY APP</h1><div class="badgeL"><b>STARONE</b><span>LOTTERY</span></div></div>',after:function(){setTimeout(function(){if(cur=='intro')go('welcome',1)},1500)}}
},

welcome:function(){
 return{b:'<div class="cen"><h1 class="h1">Welcome</h1><div style="margin:22px 0 8px">'+hero(200)+'</div><button class="btn o" onclick="go(\'login\')">Login '+ic('login')+'</button><button class="btn o" onclick="go(\'reg\')">New? Register Now!</button></div>'}
},

reg:function(){
 return{h:'back',b:'<h1 class="h1" style="margin-top:8px">Register yourself</h1><p class="sub">Create your STARONE account</p><input class="in" id="fn" placeholder="Enter Your Full Name" autocomplete="name"><input class="in" id="em" type="email" placeholder="Enter Your Email Id" autocomplete="email"><input class="in" id="mb" inputmode="numeric" maxlength="10" placeholder="Your Mobile Number" autocomplete="tel"><input class="in" id="rp1" type="password" placeholder="Create Password"><input class="in" id="rp2" type="password" placeholder="Confirm Password"><p class="er" id="er"></p><div style="margin-top:6px">'+hero(120)+'</div><button class="btn" onclick="registerUser()">Create Account →</button>'}
},

ver:function(){
 return{h:'back',b:'<h1 class="h1" style="margin-top:8px;margin-bottom:16px">Verify your email</h1>'+row(U.n)+row(U.e)+row(U.m)+'<p class="sub" style="margin:14px 0">We sent a verification link to<br><b>'+escapeHtml(U.e)+'</b></p><p class="sub">Open your email and click the verification link. Then return here and login.</p><p class="er" id="er"></p><button class="btn" onclick="go(\'login\')">Go to Login</button><button class="btn o" onclick="resendVerification()">Resend Email</button>'}
},

login:function(){
 return{h:'back',b:'<h1 class="h1" style="margin-top:8px;letter-spacing:2px">LOGIN</h1><p class="sub">Login with your registered email and password</p><input class="in" id="le" type="email" autocomplete="email" placeholder="Email Address"><input class="in" id="lp" type="password" autocomplete="current-password" placeholder="Password"><p class="er" id="er"></p><button class="btn" onclick="loginGo()">Login '+ic('login')+'</button><button class="lnk" onclick="forgotPassword()">Forgot Password?</button>'}
},

home:function(){
 var cards=L.slice(0,2).map(function(_,i){return lcard(i)}).join('');
 return{h:'menu',n:0,b:'<h1 class="h1" style="text-align:left;font-size:22px;font-weight:600;margin-bottom:14px">Live Contest</h1>'+(cards||'<div class="card cd"><b>No live contests yet</b><p class="sub" style="text-align:left">Contest data will appear here when added.</p></div>')}
},

det:function(){
 var l=L[li];
 return{h:'back',b:'<div class="row"><h1 class="h2" style="font-size:22px;font-weight:700">'+escapeHtml(l.name)+'</h1><span class="pill c">'+money(l.price)+'</span></div><div class="stat"><span>Total '+Number(l.total||0)+'</span><span>Available '+Number(l.avail||0)+'</span><span>'+formatDate(l.draw_date||'')+'</span></div><div class="tabs" id="tb"></div><div class="grid" id="gr"></div>',f:'<div class="tray"><b>Selected Tickets <span id="sc"></span></b><div class="chips" id="ch"></div><button class="btn" style="margin-top:10px" id="nx" onclick="go(\'buy\')" disabled>Continue</button></div>',after:draw}
},

buy:function(){
 var l=L[li];
 return{h:'back',b:'<h1 class="h2" style="font-size:22px;font-weight:700">Buy Tickets</h1><div class="stat"><span>Total Selected '+sel.length+'</span><span>Entry '+money(l.price)+'</span></div><div class="chips">'+chips()+'</div><input class="in" id="hn" placeholder="Lottery Holder Name" value="'+escapeHtml(U.n)+'"><div class="card cd" style="margin-top:14px"><b>Payment</b><p class="sub" style="text-align:left;margin-top:8px">Payment gateway is not connected. No payment will be processed.</p></div><p class="er" id="er"></p><button class="btn o" onclick="goBack()">← Select Another Tickets</button><button class="btn" onclick="pay()">Proceed to Secure Payment</button>'}
},

ok:function(){
 return{b:'<div class="cen" style="text-align:center;align-items:center"><div class="av" style="width:96px;height:96px;background:var(--active)"><svg viewBox="0 0 24 24" style="width:52px;height:52px;stroke-width:2.4">'+I.check+'</svg></div><h1 class="h1" style="margin-top:20px">Tickets Created</h1><p class="sub">Your ticket record has been saved.</p><div class="card cd" style="width:100%;margin-top:20px;text-align:left"><b>'+escapeHtml(PS.l)+'</b><div class="row" style="margin-top:10px"><span>Tickets</span><b>'+PS.n+'</b></div><div class="row" style="margin-top:6px"><span>Total</span><b>'+money(PS.total)+'</b></div></div><button class="btn" onclick="tab(\'tix\')">View My Tickets</button></div>'}
},

tix:function(){
 return{h:'menu',n:1,b:'<h1 class="h1" style="text-align:left;font-size:22px;font-weight:600;margin-bottom:14px">My Tickets</h1>'+(mine.length?mine.map(tcard).join(''):'<div class="card cd"><b>No tickets yet</b><p class="sub" style="text-align:left">Your tickets will appear here.</p></div>')}
},

win:function(){
 return{h:'menu',n:2,b:'<h1 class="h1" style="text-align:left;font-size:22px;font-weight:600;margin-bottom:14px">Winners</h1>'+(W.length?W.map(function(w){return '<div class="card cd row" style="justify-content:flex-start;gap:12px">'+av(46)+'<div style="flex:1"><b>'+escapeHtml(w.name)+'</b><br><small>'+escapeHtml(w.lottery_name)+' • '+formatDate(w.result_date)+'</small></div><b style="color:var(--active)">'+money(w.prize_amount)+'</b></div>'}).join(''):'<div class="card cd">No published winners yet.</div>')}
},

prof:function(){
 return{h:'menu',n:3,b:'<div style="text-align:center;padding:6px 0 16px">'+av(96)+'<h2 class="h2" style="margin-top:10px">'+escapeHtml(U.n||'User')+'</h2><small>'+escapeHtml(U.m||'')+'</small></div>'+mrow('user','Personal Information',"misc('Personal Information','Name: '+escapeHtml(U.n)+' • Email: '+escapeHtml(U.e)+' • Mobile: '+escapeHtml(U.m)+'')")+mrow('ticket','My Tickets',"tab('tix')")+mrow('gear','Settings',"misc('Settings','Account authentication is handled securely by Supabase.')")+mrow('help','Support',"misc('Support','Email: staronelottery01@gmail.com')")+mrow('login','Logout','logout()')}
},

misc:function(){
 return{h:'back',b:'<h1 class="h1" style="margin-top:8px">'+M.t+'</h1><p class="sub" style="margin-top:14px;line-height:1.6">'+M.x+'</p>'}
}

};

function R(){
 var s=SC[cur]();
 app.innerHTML=(s.h?hdr(s.h):'')+'<div class="body">'+s.b+'</div>'+(s.f||'')+(s.n!=null?nav(s.n):'');
 if(s.after)s.after();
}

function go(id,rep){
 dr(0);
 if(!rep)st.push(cur);
 cur=id;
 R();
}

function tab(id){
 dr(0);
 st=[];
 cur=id;
 R();
}

function goBack(){
 if($('dr').classList.contains('on')){
  dr(0);
  return true;
 }
 if(st.length){
  cur=st.pop();
  R();
  return true;
 }
 if(cur!='home'&&TABS.indexOf(cur)>-1){
  tab('home');

function toast(m){
 var d=document.createElement('div');
 d.className='toast';
 d.textContent=m;
 document.body.appendChild(d);
 setTimeout(function(){d.remove()},2200);
}

function er(m){
 var e=$('er');
 if(e)e.textContent=m;
 else toast(m);
}

async function registerUser(){
 if(authBusy)return;

 var n=$('fn').value.trim(),
 e=$('em').value.trim().toLowerCase(),
 m=$('mb').value.trim(),
 p1=$('rp1').value,
 p2=$('rp2').value;

 if(!n)return er('Please enter your full name');
 if(!/^\S+@\S+\.\S+$/.test(e))return er('Please enter a valid email id');
 if(!/^\d{10}$/.test(m))return er('Mobile number must be 10 digits');
 if(p1.length<6)return er('Password must be at least 6 characters');
 if(p1!==p2)return er('Passwords do not match');

 authBusy=true;

 try{
  var r=await db.auth.signUp({
   email:e,
   password:p1,
   options:{data:{full_name:n,mobile:'+91 '+m}}
  });

  if(r.error)throw r.error;

  U={n:n,e:e,m:'+91 '+m};
  pend='reg';

  if(r.data.session){
   session=r.data.session;
   await loadData();
   st=[];
   cur='home';
   R();
  }else{
   go('ver');
  }

 }catch(x){
  console.error(x);
  er(x.message||'Registration failed');
 }finally{
  authBusy=false;
 }
}

async function loginGo(){
 if(authBusy)return;

 var e=$('le').value.trim().toLowerCase(),

  if(r.error)throw r.error;

  session=r.data.session;
  await loadData();

  st=[];

 }catch(x){

 }finally{
  authBusy=false;
 }
}

function draw(){
 var l=L[li],tb='',g='';

 ['A','B','C','D'].forEach(function(s){
  tb+='<button class="'+(s==ser?'a':'')+'" onclick="ser=\''+s+'\';draw()">'+escapeHtml(l.pre||'')+s+' - SERIES</button>';
 });

 for(var i=1;i<=30;i++){
  var n=(l.pre||'TK')+ser+('00'+i).slice(-3);
  g+='<button class="'+(sel.indexOf(n)>-1?'s':'')+'" onclick="tk(\''+n+'\')">'+n+'</button>';
 }

 $('tb').innerHTML=tb;
 $('gr').innerHTML=g;
 $('ch').innerHTML=chips()||'<small>No ticket selected</small>';
 $('sc').textContent='('+sel.length+'/8)';
 $('nx').disabled=!sel.length;
}

function tk(n){
 var i=sel.indexOf(n);
 if(i>-1)sel.splice(i,1);
 else if(sel.length<8)sel.push(n);
 else toast('Maximum 8 tickets allowed');
 draw();
}

 er('Payment gateway is not connected. No payment has been processed and no ticket has been marked as paid.');
